name: Ultimate Control Gates
on:
  pull_request:
    paths:
      - 'base44/functions/**'
      - 'base44/entities/**'
      - 'base44/config.jsonc'
      - 'tests/control-gates.static.test.mjs'
      - '.github/workflows/ultimate-control-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ultimate-control-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Static protection regression tests
        run: node --test tests/control-gates.static.test.mjs
      - name: Install packages without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
